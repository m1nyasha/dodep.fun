packages:
  - shared
  - api
  - ui
  - app
  - admin
  - agents
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
  - '@nestjs/common@12.1.3'
  - '@nestjs/core@12.1.3'
  - '@nestjs/platform-express@12.1.3'
  - '@nestjs/platform-ws@12.1.3'
  - '@nestjs/websockets@12.1.3'
  - '@nestjs/schematics@12.0.7'
  - '@nestjs/testing@12.1.3'
  - happy-dom@21.0.1
  - '@sentry/bundler-plugins@11.7.0'
  - '@sentry/conventions@0.27.0'
  - '@sentry/core@11.7.0'
  - '@sentry/nestjs@11.7.0'
  - '@sentry/node@11.7.0'
  - '@sentry/opentelemetry@11.7.0'
  - '@sentry/server-runtime-injection@11.7.0'
  - '@sentry/server-utils@11.7.0'
  - '@sentry/browser-utils@11.7.0'
  - '@sentry/browser@11.7.0'
  - '@sentry/cloudflare@11.7.0'
  - '@sentry/feedback@11.7.0'
  - '@sentry/nuxt@11.7.0'
  - '@sentry/replay-canvas@11.7.0'
  - '@sentry/replay@11.7.0'
  - '@sentry/vue@11.7.0'
