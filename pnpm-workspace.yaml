packages:
  - shared
  - api
  - ui
  - app
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
  - '@nestjs/common@12.1.3'
  - '@nestjs/core@12.1.3'
  - '@nestjs/platform-express@12.1.3'
  - '@nestjs/platform-ws@12.1.3'
  - '@nestjs/websockets@12.1.3'
  - '@nestjs/schematics@12.0.7'
  - '@nestjs/testing@12.1.3'
  - happy-dom@21.0.1
